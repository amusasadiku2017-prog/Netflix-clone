<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA+ | Watch Movies</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <h1 class="logo">NOVA+</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#trending">TV Shows</a>
        <a href="#popular">Movies</a>
        <a href="#mylist">My List</a>
    </nav>

    <input type="text" id="search" placeholder="Search movies...">
    <span class="profile">👤</span>
</header>

<section class="hero" id="home">
    <div class="hero-content">
        <p class="label">NOVA ORIGINAL</p>
        <h2>THE LAST KINGDOM</h2>
        <p>
            A world of adventure, mystery and unforgettable stories.
            Discover your next favourite movie.
        </p>

        <button onclick="playMovie()">▶ Play</button>
        <button class="secondary" onclick="addFeatured()">＋ My List</button>
    </div>
</section>

<main>

    <section class="movie-section" id="trending">
        <h2>Trending Now</h2>
        <div class="movie-row" id="trendingMovies"></div>
    </section>

    <section class="movie-section" id="popular">
        <h2>Popular Movies</h2>
        <div class="movie-row" id="popularMovies"></div>
    </section>

    <section class="movie-section">
        <h2>Action Movies</h2>
        <div class="movie-row" id="actionMovies"></div>
    </section>

    <section class="movie-section" id="mylist">
        <h2>My List</h2>
        <div class="movie-row" id="myListMovies"></div>
    </section>

</main>

<div id="message"></div>

<footer>
    <p>© 2026 NOVA+ Entertainment. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
  </html>
